name: Build RAX3000Q
on:
  workflow_dispatch:

permissions:
  contents: write        # 允许创建 Release 的权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-cache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}
        restore-keys: ccache-

    - name: Cache host tools
      uses: actions/cache@v4
      with:
        path: build_dir/host
        key: host-tools

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync unzip zlib1g-dev file wget ccache

    - name: Enable ccache
      run: |
        echo 'export PATH="/usr/lib/ccache:$PATH"' >> $GITHUB_ENV
        echo 'export CC="ccache gcc"' >> $GITHUB_ENV
        echo 'export CXX="ccache g++"' >> $GITHUB_ENV

    - name: Fix permissions
      run: chmod -R +x .

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config for RAX3000Q
      run: |
        rm -f .config
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y" >> .config
        make defconfig

    - name: Build firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: rax3000q-firmware
        path: bin/targets/

    # ===== 编译完自动发布到 GitHub Release =====
    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: rax3000q-${{ github.run_id }}
        name: RAX3000Q Firmware (build ${{ github.run_id }})
        body: |
          OpenWrt 25.12 (kernel 6.12) CMCC RAX3000Q 固件
        files: bin/targets/qualcommax/ipq50xx/*
        draft: false
        prerelease: false
